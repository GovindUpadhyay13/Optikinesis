<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
    <defs>
        <!-- Background & Ring Gradients -->
        <linearGradient id="optiRing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#089BB5" />
            <stop offset="50%" stop-color="#2474C7" />
            <stop offset="100%" stop-color="#6556A8" />
        </linearGradient>
        <linearGradient id="optiPulse" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2474C7" />
            <stop offset="100%" stop-color="#089BB5" />
        </linearGradient>
        <linearGradient id="optiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#089BB5" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#6556A8" stop-opacity="0.1" />
        </linearGradient>
        <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#174B85" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Outer Circular Assistive Tech Orbit -->
    <circle cx="120" cy="120" r="104" stroke="url(#optiRing)" stroke-width="8" stroke-linecap="round" stroke-dasharray="520 80" filter="url(#softShadow)"/>
    <circle cx="120" cy="120" r="88" fill="url(#optiGlow)" />

    <!-- Digital Signal & Interaction Arcs (Eye Gaze & Motion Rays) -->
    <path d="M152 75 C168 88 178 106 178 126" stroke="#089BB5" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.85"/>
    <path d="M164 65 C184 82 194 104 194 128" stroke="#2474C7" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Stylized Person Using Assistive Technology / Active Wheelchair & Digital Interaction -->
    <!-- Head / Gaze Center -->
    <circle cx="124" cy="74" r="15" fill="url(#optiPulse)" />
    <!-- Active Iris / Focus Point -->
    <circle cx="129" cy="73" r="4.5" fill="#FFFFFF" />

    <!-- Ergonomic Torso & Forward Motion -->
    <path d="M106 112 C108 94 116 88 128 92 C134 94 140 102 144 114" stroke="#2474C7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Assistive Wheel / Circular Kinetic Wheel -->
    <circle cx="112" cy="144" r="34" stroke="url(#optiRing)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Wheel Hub & Spokes -->
    <circle cx="112" cy="144" r="8" fill="#174B85" />
    <path d="M112 110 L112 144 L138 158" stroke="#089BB5" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M112 144 L88 158" stroke="#6556A8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Arm & Digital Gaze / Kinetic Interaction Beam -->
    <path d="M126 104 L146 120 L166 112" stroke="#089BB5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Interaction Node / Spark of Independence -->
    <circle cx="168" cy="112" r="5" fill="#6556A8" />
    <circle cx="168" cy="112" r="2.5" fill="#FFFFFF" />

    <!-- Forward Footrest / Foundation Base -->
    <path d="M136 142 L148 162 L160 162" stroke="#2474C7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
